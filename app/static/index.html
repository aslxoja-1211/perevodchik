<!DOCTYPE html>
<html lang="uz" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ovozli Tarjimon</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            noirBg: '#151515',
            creamSheet: '#ede8df',
            creamSheetDark: '#e3ddd1',
            terracotta: '#885151',
            terracottaHover: '#995c5c',
            darkPill: '#242323',
            mediumPill: '#413f3f',
            neonGreen: '#22c55e',
          }
        }
      }
    }
  </script>
  <style>
    /* Organic Fluid Orb Animations */
    @keyframes morph-blob {
      0% {
        border-radius: 62% 38% 46% 54% / 56% 36% 64% 44%;
      }
      33% {
        border-radius: 48% 52% 60% 40% / 42% 64% 36% 58%;
      }
      66% {
        border-radius: 58% 42% 38% 62% / 62% 44% 56% 38%;
      }
      100% {
        border-radius: 62% 38% 46% 54% / 56% 36% 64% 44%;
      }
    }

    .organic-orb {
      animation: morph-blob 9s ease-in-out infinite alternate;
      background: radial-gradient(circle at 65% 35%, #2a2222 0%, #171515 70%);
      box-shadow: 
        inset 0 0 35px rgba(168, 107, 107, 0.35),
        0 15px 45px rgba(0, 0, 0, 0.6);
      border: 1.5px solid rgba(168, 107, 107, 0.45);
      transition: border-color 0.4s ease, box-shadow 0.4s ease;
    }

    .organic-orb.recording {
      border-color: rgba(244, 63, 94, 0.85);
      box-shadow: 
        inset 0 0 50px rgba(244, 63, 94, 0.5),
        0 0 50px rgba(244, 63, 94, 0.3);
      /* Orb o'lchami kattalashmaydi, barqaror qoladi */
    }

    /* Floating Luminous Pearl inside the Orb */
    .luminous-pearl {
      background: radial-gradient(circle at 35% 35%, #ffffff 0%, #ede5d8 60%, #c4baa7 100%);
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.85), 0 0 55px rgba(237, 229, 216, 0.5);
      will-change: transform;
    }

    /* Smooth Blur Card Reveal */
    @keyframes card-blur-in {
      0% {
        opacity: 0;
        filter: blur(16px);
        transform: translateY(24px) scale(0.96);
      }
      100% {
        opacity: 1;
        filter: blur(0px);
        transform: translateY(0) scale(1);
      }
    }
    .animate-blur-card {
      animation: card-blur-in 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Pulse Ring for Microphone */
    @keyframes mic-pulse-ring {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.3); opacity: 0.2; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    .mic-pulse-ring-anim {
      animation: mic-pulse-ring 1.8s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 999px; }
  </style>
</head>
<body class="bg-[#0e0e0e] text-gray-100 min-h-screen flex flex-col items-center justify-center p-0 sm:p-4 font-sans antialiased selection:bg-[#885151] selection:text-white select-none">

  <!-- APP DEVICE FRAME (Exact layout from the reference mockup) -->
  <div class="w-full max-w-sm sm:max-w-md h-screen sm:h-[840px] sm:max-h-[92vh] sm:rounded-[44px] sm:border-[5px] sm:border-[#2a2929] bg-[#161616] flex flex-col justify-between relative overflow-hidden shadow-[0_25px_60px_-15px_rgba(0,0,0,0.85)]">
    
    <!-- TOP BAR (Logo + Green Status Pill) -->
    <div class="pt-5 px-6 pb-2 flex items-center justify-between z-30">
      
      <!-- App Name & Minimal Icon -->
      <div class="flex items-center gap-2">
        <div class="w-7 h-7 rounded-lg bg-gradient-to-tr from-[#885151] to-[#3a3737] flex items-center justify-center text-white text-xs shadow-md">
          <i class="fa-solid fa-earth-americas text-[11px]"></i>
        </div>
        <div>
          <h1 class="text-xs font-bold tracking-tight text-gray-200 uppercase leading-none">Ovozli Tarjimon</h1>
          <p class="text-[9px] text-gray-500 font-mono tracking-wider mt-0.5">AI VOICE TRANSLATOR</p>
        </div>
      </div>

      <!-- Reference Neon Green Pill -->
      <div class="flex items-center gap-2">
        <div id="statusBadge" class="flex items-center gap-1.5 px-3 py-1 rounded-full bg-[#1e2e22] border border-[#22c55e]/40 shadow-sm shadow-[#22c55e]/20">
          <span class="w-2 h-2 rounded-full bg-[#22c55e] animate-pulse"></span>
          <span id="statusText" class="text-[10px] font-bold text-[#4ade80] tracking-wider uppercase">Tayyor</span>
        </div>
      </div>

    </div>

    <!-- CENTER CANVAS AREA (Organic Morphing Orb + Minimalist Directional Labels) -->
    <div class="flex-1 flex flex-col items-center justify-center relative px-6 py-2 overflow-hidden">
      
      <!-- Minimalist Axis Labels around Orb (Like "WEAK", "STRONG", "BITTER", etc. in the image) -->
      <div class="absolute inset-x-0 top-3 text-center">
        <span class="text-[10px] font-mono tracking-[0.25em] text-gray-500 uppercase" id="labelTop">NUTQ TILI (UZ)</span>
      </div>
      <div class="absolute inset-y-0 left-2 flex items-center">
        <span class="text-[9px] font-mono tracking-[0.25em] text-gray-600 uppercase -rotate-90 origin-center" id="labelLeft">JONLI VAD</span>
      </div>
      <div class="absolute inset-y-0 right-2 flex items-center">
        <span class="text-[9px] font-mono tracking-[0.25em] text-gray-600 uppercase rotate-90 origin-center" id="labelRight">TEZKOR AI</span>
      </div>
      <div class="absolute inset-x-0 bottom-4 text-center">
        <span class="text-[10px] font-mono tracking-[0.25em] text-gray-500 uppercase" id="labelBottom">TARJIMA TILI (TR)</span>
      </div>

      <!-- The Morphing Organic Blob Orb -->
      <div id="mainOrganicOrb" class="organic-orb w-64 h-64 sm:w-72 sm:h-72 relative flex items-center justify-center cursor-pointer active:scale-95 transition-transform duration-300">
        
        <!-- Inside Glowing Luminous Pearl (Moves and reacts to speech!) -->
        <div id="luminousPearl" class="luminous-pearl w-14 h-14 rounded-full absolute flex items-center justify-center pointer-events-none" style="top: calc(50% - 28px); left: calc(50% - 28px); transform: translate(52px, -52px);">
          <span class="w-1.5 h-1.5 rounded-full bg-[#9f9687] opacity-60"></span>
        </div>

        <!-- Center Prompt Text (Hidden when active) -->
        <div id="orbIdleText" class="text-center px-6 pointer-events-none transition-opacity duration-300">
          <i class="fa-solid fa-microphone-lines text-2xl text-rose-300/40 mb-2 block animate-pulse"></i>
          <p class="text-xs font-semibold tracking-wider text-gray-300/80 uppercase">Gapiring...</p>
          <p class="text-[10px] text-gray-500 font-mono mt-1">Avtomatik sukut sezgich faol</p>
        </div>

        <!-- Live Transcribing Overlay inside Orb (appears when speaking) -->
        <div id="orbLiveTranscription" class="hidden absolute inset-0 rounded-full flex flex-col items-center justify-center p-6 text-center z-20 backdrop-blur-[2px]">
          <span class="w-2.5 h-2.5 rounded-full bg-rose-500 animate-ping mb-2"></span>
          <p id="livePartialText" class="text-xs sm:text-sm font-semibold text-rose-200 leading-snug line-clamp-4">Eshitmoqda...</p>
          <span id="liveTimerText" class="text-[10px] font-mono text-gray-400 mt-2">00:01</span>
        </div>

      </div>

      <!-- FLOATING TRANSLATION RESULT CARD (Appears over/below the orb with a sleek blur transition!) -->
      <div id="floatingResultCard" class="hidden absolute inset-x-4 top-10 bottom-6 z-30 bg-[#121212]/95 backdrop-blur-2xl border border-white/10 rounded-3xl p-5 shadow-2xl flex flex-col justify-between animate-blur-card">
        
        <!-- Header: Languages + Close Button -->
        <div class="flex items-center justify-between pb-2.5 border-b border-gray-800">
          <div class="flex items-center gap-2">
            <span id="cardDirectionBadge" class="px-2.5 py-0.5 rounded-full bg-[#885151]/30 border border-[#885151]/60 text-[#e9a6a6] text-[10px] font-mono font-bold tracking-wider uppercase">
              UZ ➔ TR
            </span>
            <span id="cardTimestamp" class="text-[10px] text-gray-500 font-mono">15:00</span>
          </div>
          <button id="dismissCardBtn" class="text-gray-400 hover:text-white p-1 rounded-lg hover:bg-gray-800 text-xs transition" title="Yopish">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>

        <!-- Middle: Source Speech (Top) & Translation (Bottom) -->
        <div class="flex-1 overflow-y-auto py-3 space-y-4 pr-1">
          
          <!-- Top: Asl Nutq -->
          <div class="space-y-1">
            <div class="flex items-center justify-between text-xs text-gray-400">
              <span class="flex items-center gap-1.5 font-medium">
                <span id="cardSrcFlag">🇺🇿</span>
                <span id="cardSrcName" class="text-gray-300 font-semibold">O'zbekcha (Asl nutq)</span>
              </span>
              <button id="copySrcBtn" class="text-gray-400 hover:text-white p-1 rounded transition text-xs" title="Nusxalash">
                <i class="fa-regular fa-copy"></i>
              </button>
            </div>
            <p id="cardSrcText" class="text-sm text-gray-200 font-medium leading-relaxed bg-[#1a1919] p-3 rounded-2xl border border-gray-800/80">...</p>
          </div>

          <!-- Bottom: Tarjima -->
          <div class="space-y-1">
            <div class="flex items-center justify-between text-xs text-rose-300">
              <span class="flex items-center gap-1.5 font-semibold">
                <span id="cardTgtFlag">🇹🇷</span>
                <span id="cardTgtName">Türkçe (Tarjima)</span>
              </span>
              <button id="copyTgtBtn" class="text-rose-400 hover:text-rose-300 p-1 rounded transition text-xs" title="Nusxalash">
                <i class="fa-regular fa-copy"></i>
              </button>
            </div>
            <p id="cardTgtText" class="text-base font-bold text-white leading-relaxed bg-[#201d1d] p-3 rounded-2xl border border-[#885151]/30">...</p>
          </div>

        </div>

        <!-- Bottom Action Bar on the Card -->
        <div class="pt-3 border-t border-gray-800 flex items-center justify-between gap-2">
          <div class="flex items-center gap-2">
            <button id="cardPlayAudioBtn" class="px-4 py-2 rounded-2xl bg-[#885151] hover:bg-[#995c5c] text-white text-xs font-bold flex items-center gap-2 shadow-lg shadow-[#885151]/30 transition active:scale-95">
              <i class="fa-solid fa-play text-xs" id="cardPlayIcon"></i>
              <span>Qayta eshitish</span>
            </button>
            <button id="cardDownloadAudioBtn" class="p-2.5 rounded-2xl bg-gray-800 hover:bg-gray-700 text-gray-300 text-xs transition" title="MP3 yuklab olish">
              <i class="fa-solid fa-download"></i>
            </button>
          </div>
          <span id="cardLatencyText" class="text-[10px] font-mono text-gray-500">2400 ms</span>
        </div>

      </div>

    </div>

    <!-- BOTTOM SHEET CONTAINER (Exact match to the Cream/Ivory Sheet in the reference image) -->
    <div class="bg-[#ede8df] rounded-t-[38px] p-5 sm:p-6 flex flex-col gap-3 shadow-[0_-15px_30px_rgba(0,0,0,0.4)] text-[#1a1919] z-20">
      
      <!-- ROW 1: [ Source Lang Pill ] [ Swap Square ] [ Target Lang Pill ] -->
      <div class="flex items-center gap-2">
        
        <!-- Source Lang Pill -->
        <button id="openSrcModalBtn" class="flex-1 h-12 rounded-full bg-[#242323] hover:bg-[#2e2d2d] text-white px-4 flex items-center justify-between text-xs font-semibold shadow-sm transition active:scale-95">
          <span id="srcPillText" class="flex items-center gap-1.5 truncate">
            <span>🇺🇿</span> <span>O'zbekcha</span>
          </span>
          <i class="fa-solid fa-chevron-down text-[10px] text-gray-400 ml-1"></i>
        </button>

        <!-- Swap Square Button -->
        <button id="swapLangsBtn" class="w-12 h-12 rounded-2xl bg-[#242323] hover:bg-[#2e2d2d] text-white flex items-center justify-center shadow-sm shrink-0 transition active:scale-90" title="Tillarni almashtirish">
          <i class="fa-solid fa-arrow-right-arrow-left text-xs text-rose-300"></i>
        </button>

        <!-- Target Lang Pill -->
        <button id="openTgtModalBtn" class="flex-1 h-12 rounded-full bg-[#242323] hover:bg-[#2e2d2d] text-white px-4 flex items-center justify-between text-xs font-semibold shadow-sm transition active:scale-95">
          <span id="tgtPillText" class="flex items-center gap-1.5 truncate">
            <span>🇹🇷</span> <span>Türkçe</span>
          </span>
          <i class="fa-solid fa-chevron-down text-[10px] text-gray-400 ml-1"></i>
        </button>

      </div>

      <!-- ROW 2: The Red Translator Voice Pill (Terracotta Wide Button) -->
      <button id="openVoiceModalBtn" class="w-full h-12 rounded-full bg-[#885151] hover:bg-[#995c5c] text-white px-5 flex items-center justify-between text-xs font-bold tracking-wide shadow-md shadow-[#885151]/25 transition active:scale-[0.98]">
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-headphones-simple text-sm text-rose-200"></i>
          <span id="activeVoiceDisplay">Emel (Türkçe)</span>
        </div>
        <div class="flex items-center gap-2 text-rose-200/90 text-[11px] font-medium">
          <span id="activeSpeedDisplay">Tezlik: 1.0x</span>
          <i class="fa-solid fa-chevron-up text-[9px] ml-1"></i>
        </div>
      </button>

      <!-- ROW 3: [ Audio File Upload / Text ] [ Big Microphone Button ] -->
      <div class="flex items-center gap-2.5">
        
        <!-- Left: Audio File Upload Button with small text toggle -->
        <div class="flex-1 flex items-center gap-1.5 h-14 rounded-full bg-[#413f3f] hover:bg-[#4d4b4b] text-white px-4 shadow-sm transition">
          <input type="file" id="audioFileInput" accept="audio/*" class="hidden">
          <button id="uploadAudioBtn" class="flex-1 flex items-center justify-center gap-2 text-xs font-semibold h-full" title="Audio faylni yuklab tarjima qilish">
            <i class="fa-solid fa-arrow-up-from-bracket text-xs text-rose-300"></i>
            <span>Audio fayl</span>
          </button>
          
          <div class="w-[1px] h-6 bg-gray-500/50"></div>
          
          <button id="toggleTextModeBtn" class="p-2 text-gray-300 hover:text-white rounded-lg transition" title="Matn yozish">
            <i class="fa-regular fa-keyboard text-sm"></i>
          </button>
        </div>

        <!-- Right: Big Microphone Button (Exact position from the mockup) -->
        <div class="relative flex items-center justify-center shrink-0">
          <div id="micPulseRing" class="absolute inset-0 rounded-full bg-rose-600/40 mic-pulse-ring-anim hidden"></div>
          <button id="micBtn" class="relative z-10 w-28 sm:w-32 h-14 rounded-full bg-[#242323] hover:bg-[#1a1919] text-white flex items-center justify-center gap-2 shadow-xl transition-all duration-300 transform active:scale-95 focus:outline-none">
            <i class="fa-solid fa-microphone text-lg" id="micIcon"></i>
            <span id="micButtonText" class="text-xs font-bold uppercase tracking-wider">Gapirish</span>
          </button>
        </div>

      </div>

      <!-- Quick Text Input Drawer (Expands when keyboard icon clicked) -->
      <div id="textInputDrawer" class="hidden pt-1">
        <div class="flex items-center gap-2 bg-[#f6f2ea] border border-[#d2cbbe] rounded-2xl p-1.5">
          <input id="manualTextInput" type="text" placeholder="Tarjima uchun matn kiriting..." class="flex-1 bg-transparent border-0 text-xs text-[#1a1919] placeholder-gray-500 px-3 py-1 focus:outline-none font-medium">
          <button id="sendTextBtn" class="w-8 h-8 rounded-xl bg-[#885151] hover:bg-[#995c5c] text-white flex items-center justify-center text-xs transition">
            <i class="fa-solid fa-arrow-up"></i>
          </button>
        </div>
      </div>

    </div>

  </div>

  <!-- LANGUAGE SELECTION MODAL -->
  <div id="langModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-[#1c1b1b] border border-gray-800 w-full max-w-sm rounded-t-[36px] sm:rounded-3xl p-6 shadow-2xl flex flex-col gap-4 animate-blur-card">
      
      <div class="flex items-center justify-between pb-3 border-b border-gray-800">
        <h3 id="langModalTitle" class="font-bold text-sm text-white">Tilni tanlang</h3>
        <button id="closeLangModalBtn" class="text-gray-400 hover:text-white p-1">
          <i class="fa-solid fa-xmark text-base"></i>
        </button>
      </div>

      <div class="flex flex-col gap-2">
        <button data-lang="uz" class="lang-opt-btn w-full p-3.5 rounded-2xl bg-[#252424] hover:bg-[#302e2e] flex items-center justify-between text-left transition text-white">
          <div class="flex items-center gap-3">
            <span class="text-xl">🇺🇿</span>
            <div>
              <p class="text-xs font-bold">O'zbekcha</p>
              <p class="text-[10px] text-gray-400">Uzbek</p>
            </div>
          </div>
          <i class="fa-solid fa-check text-rose-400 text-sm check-icon hidden"></i>
        </button>

        <button data-lang="tr" class="lang-opt-btn w-full p-3.5 rounded-2xl bg-[#252424] hover:bg-[#302e2e] flex items-center justify-between text-left transition text-white">
          <div class="flex items-center gap-3">
            <span class="text-xl">🇹🇷</span>
            <div>
              <p class="text-xs font-bold">Türkçe</p>
              <p class="text-[10px] text-gray-400">Turkish</p>
            </div>
          </div>
          <i class="fa-solid fa-check text-rose-400 text-sm check-icon hidden"></i>
        </button>

        <button data-lang="ru" class="lang-opt-btn w-full p-3.5 rounded-2xl bg-[#252424] hover:bg-[#302e2e] flex items-center justify-between text-left transition text-white">
          <div class="flex items-center gap-3">
            <span class="text-xl">🇷🇺</span>
            <div>
              <p class="text-xs font-bold">Русский</p>
              <p class="text-[10px] text-gray-400">Russian</p>
            </div>
          </div>
          <i class="fa-solid fa-check text-rose-400 text-sm check-icon hidden"></i>
        </button>

        <button data-lang="en" class="lang-opt-btn w-full p-3.5 rounded-2xl bg-[#252424] hover:bg-[#302e2e] flex items-center justify-between text-left transition text-white">
          <div class="flex items-center gap-3">
            <span class="text-xl">🇬🇧</span>
            <div>
              <p class="text-xs font-bold">English</p>
              <p class="text-[10px] text-gray-400">Inglizcha</p>
            </div>
          </div>
          <i class="fa-solid fa-check text-rose-400 text-sm check-icon hidden"></i>
        </button>

        <button data-lang="zh" class="lang-opt-btn w-full p-3.5 rounded-2xl bg-[#252424] hover:bg-[#302e2e] flex items-center justify-between text-left transition text-white">
          <div class="flex items-center gap-3">
            <span class="text-xl">🇨🇳</span>
            <div>
              <p class="text-xs font-bold">中文</p>
              <p class="text-[10px] text-gray-400">Chinese</p>
            </div>
          </div>
          <i class="fa-solid fa-check text-rose-400 text-sm check-icon hidden"></i>
        </button>
      </div>

    </div>
  </div>

  <!-- VOICE & SPEED DRAWER -->
  <div id="voiceModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-[#1c1b1b] border border-gray-800 w-full max-w-sm rounded-t-[36px] sm:rounded-3xl p-6 shadow-2xl flex flex-col gap-4 animate-blur-card">
      
      <div class="flex items-center justify-between pb-3 border-b border-gray-800">
        <h3 class="font-bold text-sm text-[#e9a6a6] flex items-center gap-2">
          <i class="fa-solid fa-headphones-simple"></i>
          <span>Tarjimon ovozi & tezligi</span>
        </h3>
        <button id="closeVoiceModalBtn" class="text-gray-400 hover:text-white p-1">
          <i class="fa-solid fa-xmark text-base"></i>
        </button>
      </div>

      <!-- Voice Selector -->
      <div>
        <label class="block text-xs font-semibold text-gray-300 mb-1.5">Neyron ovoz:</label>
        <select id="voiceSelectDropdown" class="w-full bg-[#121212] border border-gray-700 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-[#885151]">
          <optgroup label="🇹🇷 Turkcha Ovozlar">
            <option value="tr-TR-EmelNeural" selected>Emel (Türkçe) — Ayol, tabiiy</option>
            <option value="tr-TR-AhmetNeural">Ahmet (Türkçe) — Erkak</option>
          </optgroup>
          <optgroup label="🇺🇿 O'zbekcha Ovozlar">
            <option value="uz-UZ-MadinaNeural">Madina (O'zbekcha) — Ayol</option>
            <option value="uz-UZ-SardorNeural">Sardor (O'zbekcha) — Erkak</option>
          </optgroup>
          <optgroup label="🇷🇺 Ruscha Ovozlar">
            <option value="ru-RU-SvetlanaNeural">Светлана (Svetlana) — Ayol</option>
            <option value="ru-RU-DmitryNeural">Дмитрий (Dmitry) — Erkak</option>
          </optgroup>
          <optgroup label="🇬🇧 Inglizcha Ovozlar">
            <option value="en-US-AvaNeural">Ava (US) — Female</option>
            <option value="en-US-AndrewNeural">Andrew (US) — Male</option>
          </optgroup>
          <optgroup label="🇨🇳 Xitoycha Ovozlar">
            <option value="zh-CN-XiaoxiaoNeural">晓晓 (Xiaoxiao) — 女声</option>
            <option value="zh-CN-YunxiNeural">云希 (Yunxi) — 男声</option>
          </optgroup>
        </select>
      </div>

      <!-- Speech Rate -->
      <div>
        <label class="block text-xs font-semibold text-gray-300 mb-1.5">Gapirish tezligi:</label>
        <div class="grid grid-cols-3 gap-2">
          <button type="button" data-rate="-15%" class="rate-choice-btn py-2 rounded-xl border border-gray-700 bg-[#252424] text-xs font-medium text-gray-300">0.85x</button>
          <button type="button" data-rate="+0%" class="rate-choice-btn py-2 rounded-xl border border-[#885151] bg-[#885151]/30 text-xs font-semibold text-[#e9a6a6]">1.0x</button>
          <button type="button" data-rate="+15%" class="rate-choice-btn py-2 rounded-xl border border-gray-700 bg-[#252424] text-xs font-medium text-gray-300">1.15x</button>
        </div>
      </div>

      <!-- Autoplay -->
      <label class="flex items-center gap-2 text-xs text-gray-300 cursor-pointer pt-1 select-none">
        <input type="checkbox" id="autoPlayCheckbox" checked class="rounded bg-gray-800 border-gray-700 text-[#885151] focus:ring-0">
        <span>Tarjimani avtomatik ovozlashtirish</span>
      </label>

      <button id="saveVoiceSettingsBtn" class="w-full mt-2 py-2.5 rounded-xl bg-[#885151] hover:bg-[#995c5c] text-white text-xs font-bold tracking-wide transition shadow-md shadow-[#885151]/30">
        Saqlash
      </button>

    </div>
  </div>

  <!-- Audio Element for Playback -->
  <audio id="globalAudio" class="hidden" preload="auto"></audio>

  <!-- CLIENT SCRIPTS -->
  <script>
    const LANG_DATA = {
      uz: { name: "O'zbekcha", flag: "🇺🇿", defaultVoice: "uz-UZ-MadinaNeural" },
      tr: { name: "Türkçe", flag: "🇹🇷", defaultVoice: "tr-TR-EmelNeural" },
      ru: { name: "Русский", flag: "🇷🇺", defaultVoice: "ru-RU-SvetlanaNeural" },
      en: { name: "English", flag: "🇬🇧", defaultVoice: "en-US-AvaNeural" },
      zh: { name: "中文", flag: "🇨🇳", defaultVoice: "zh-CN-XiaoxiaoNeural" }
    };

    const state = {
      sourceLang: 'uz',
      targetLang: 'tr',
      selectedVoice: 'tr-TR-EmelNeural',
      selectedRate: '+0%',
      isRecording: false,
      autoPlay: true,
      audioCtx: null,
      mediaStream: null,
      scriptProcessor: null,
      analyser: null,
      ws: null,
      currentAudioBase64: null,
      recStartTime: 0,
      recTimerInterval: null,
      activeModalType: 'src',

      // VAD
      hasSpoken: false,
      lastVoiceTime: 0,
      silenceThresholdMs: 1400,
      voiceRmsThreshold: 0.007,
      currentRms: 0,
    };

    // DOM Elements
    const srcPillText = document.getElementById('srcPillText');
    const tgtPillText = document.getElementById('tgtPillText');
    const swapLangsBtn = document.getElementById('swapLangsBtn');
    const openSrcModalBtn = document.getElementById('openSrcModalBtn');
    const openTgtModalBtn = document.getElementById('openTgtModalBtn');
    const langModal = document.getElementById('langModal');
    const langModalTitle = document.getElementById('langModalTitle');
    const closeLangModalBtn = document.getElementById('closeLangModalBtn');

    const openVoiceModalBtn = document.getElementById('openVoiceModalBtn');
    const closeVoiceModalBtn = document.getElementById('closeVoiceModalBtn');
    const voiceModal = document.getElementById('voiceModal');
    const voiceSelectDropdown = document.getElementById('voiceSelectDropdown');
    const saveVoiceSettingsBtn = document.getElementById('saveVoiceSettingsBtn');
    const activeVoiceDisplay = document.getElementById('activeVoiceDisplay');
    const activeSpeedDisplay = document.getElementById('activeSpeedDisplay');
    const autoPlayCheckbox = document.getElementById('autoPlayCheckbox');

    const toggleTextModeBtn = document.getElementById('toggleTextModeBtn');
    const textInputDrawer = document.getElementById('textInputDrawer');
    const manualTextInput = document.getElementById('manualTextInput');
    const sendTextBtn = document.getElementById('sendTextBtn');

    const micBtn = document.getElementById('micBtn');
    const micIcon = document.getElementById('micIcon');
    const micPulseRing = document.getElementById('micPulseRing');
    const micButtonText = document.getElementById('micButtonText');
    const audioFileInput = document.getElementById('audioFileInput');
    const uploadAudioBtn = document.getElementById('uploadAudioBtn');

    const mainOrganicOrb = document.getElementById('mainOrganicOrb');
    const luminousPearl = document.getElementById('luminousPearl');
    const orbIdleText = document.getElementById('orbIdleText');
    const orbLiveTranscription = document.getElementById('orbLiveTranscription');
    const livePartialText = document.getElementById('livePartialText');
    const liveTimerText = document.getElementById('liveTimerText');

    const statusBadge = document.getElementById('statusBadge');
    const statusText = document.getElementById('statusText');
    const labelTop = document.getElementById('labelTop');
    const labelBottom = document.getElementById('labelBottom');

    // Floating Result Card
    const floatingResultCard = document.getElementById('floatingResultCard');
    const dismissCardBtn = document.getElementById('dismissCardBtn');
    const cardDirectionBadge = document.getElementById('cardDirectionBadge');
    const cardTimestamp = document.getElementById('cardTimestamp');
    const cardSrcFlag = document.getElementById('cardSrcFlag');
    const cardSrcName = document.getElementById('cardSrcName');
    const cardSrcText = document.getElementById('cardSrcText');
    const copySrcBtn = document.getElementById('copySrcBtn');
    const cardTgtFlag = document.getElementById('cardTgtFlag');
    const cardTgtName = document.getElementById('cardTgtName');
    const cardTgtText = document.getElementById('cardTgtText');
    const copyTgtBtn = document.getElementById('copyTgtBtn');
    const cardPlayAudioBtn = document.getElementById('cardPlayAudioBtn');
    const cardPlayIcon = document.getElementById('cardPlayIcon');
    const cardDownloadAudioBtn = document.getElementById('cardDownloadAudioBtn');
    const cardLatencyText = document.getElementById('cardLatencyText');
    const globalAudio = document.getElementById('globalAudio');

    // Update UI Elements
    function updateLanguageUI() {
      const src = LANG_DATA[state.sourceLang] || LANG_DATA.uz;
      const tgt = LANG_DATA[state.targetLang] || LANG_DATA.tr;

      srcPillText.innerHTML = `<span>${src.flag}</span> <span class="truncate">${src.name}</span>`;
      tgtPillText.innerHTML = `<span>${tgt.flag}</span> <span class="truncate">${tgt.name}</span>`;

      labelTop.textContent = `NUTQ TILI (${state.sourceLang.toUpperCase()})`;
      labelBottom.textContent = `TARJIMA TILI (${state.targetLang.toUpperCase()})`;

      state.selectedVoice = tgt.defaultVoice;
      voiceSelectDropdown.value = state.selectedVoice;
      const opt = voiceSelectDropdown.options[voiceSelectDropdown.selectedIndex];
      if (opt) activeVoiceDisplay.textContent = opt.text.split('—')[0].trim();
    }

    // Modal Language Selection
    openSrcModalBtn.addEventListener('click', () => openLangModal('src'));
    openTgtModalBtn.addEventListener('click', () => openLangModal('tgt'));
    closeLangModalBtn.addEventListener('click', () => langModal.classList.add('hidden'));

    function openLangModal(mode) {
      state.activeModalType = mode;
      langModalTitle.textContent = mode === 'src' ? "1. Nutq tilini tanlang:" : "2. Tarjima tilini tanlang:";
      
      const currentSelected = mode === 'src' ? state.sourceLang : state.targetLang;
      document.querySelectorAll('.lang-opt-btn').forEach(btn => {
        const lang = btn.getAttribute('data-lang');
        const check = btn.querySelector('.check-icon');
        if (lang === currentSelected) {
          btn.classList.add('border-[#885151]', 'bg-[#885151]/20');
          check.classList.remove('hidden');
        } else {
          btn.classList.remove('border-[#885151]', 'bg-[#885151]/20');
          check.classList.add('hidden');
        }
      });
      langModal.classList.remove('hidden');
    }

    document.querySelectorAll('.lang-opt-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const chosen = btn.getAttribute('data-lang');
        if (state.activeModalType === 'src') {
          state.sourceLang = chosen;
          if (state.sourceLang === state.targetLang) {
            state.targetLang = ['tr', 'uz', 'ru', 'en', 'zh'].find(l => l !== chosen);
          }
        } else {
          state.targetLang = chosen;
          if (state.targetLang === state.sourceLang) {
            state.sourceLang = ['uz', 'tr', 'ru', 'en', 'zh'].find(l => l !== chosen);
          }
        }
        langModal.classList.add('hidden');
        updateLanguageUI();

        // If card is currently shown, re-translate instantly
        if (!floatingResultCard.classList.contains('hidden')) {
          const srcText = cardSrcText.textContent.trim();
          if (srcText && srcText !== '...') {
            await runTextTranslation(srcText);
          }
        }
      });
    });

    // Swap Languages Button
    swapLangsBtn.addEventListener('click', async () => {
      const prevSrc = state.sourceLang;
      state.sourceLang = state.targetLang;
      state.targetLang = prevSrc;
      updateLanguageUI();

      if (!floatingResultCard.classList.contains('hidden')) {
        const tgtText = cardTgtText.textContent.trim();
        if (tgtText && tgtText !== '...') {
          await runTextTranslation(tgtText);
        }
      }
    });

    // Voice & Speed Modal
    openVoiceModalBtn.addEventListener('click', () => voiceModal.classList.remove('hidden'));
    closeVoiceModalBtn.addEventListener('click', () => voiceModal.classList.add('hidden'));
    saveVoiceSettingsBtn.addEventListener('click', () => {
      state.selectedVoice = voiceSelectDropdown.value;
      const opt = voiceSelectDropdown.options[voiceSelectDropdown.selectedIndex];
      if (opt) activeVoiceDisplay.textContent = opt.text.split('—')[0].trim();
      voiceModal.classList.add('hidden');
    });

    document.querySelectorAll('.rate-choice-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.rate-choice-btn').forEach(b => {
          b.className = 'rate-choice-btn py-2 rounded-xl border border-gray-700 bg-[#252424] text-xs font-medium text-gray-300';
        });
        btn.className = 'rate-choice-btn py-2 rounded-xl border border-[#885151] bg-[#885151]/30 text-xs font-semibold text-[#e9a6a6]';
        state.selectedRate = btn.getAttribute('data-rate');
        activeSpeedDisplay.textContent = `Tezlik: ${btn.textContent}`;
      });
    });

    autoPlayCheckbox.addEventListener('change', (e) => {
      state.autoPlay = e.target.checked;
    });

    // Text Input Mode
    toggleTextModeBtn.addEventListener('click', () => {
      textInputDrawer.classList.toggle('hidden');
      if (!textInputDrawer.classList.contains('hidden')) {
        manualTextInput.focus();
      }
    });

    sendTextBtn.addEventListener('click', submitManualText);
    manualTextInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') submitManualText();
    });

    async function submitManualText() {
      const val = manualTextInput.value.trim();
      if (!val) return;
      manualTextInput.value = '';
      textInputDrawer.classList.add('hidden');
      await runTextTranslation(val);
    }

    // Direct Text Translation
    async function runTextTranslation(text) {
      if (!text) return;
      primeAudioPlayback();
      showListeningUI("Tarjima qilinmoqda...");

      try {
        const resp = await fetch('/api/v1/translate-text', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            text: text,
            source_lang: state.sourceLang,
            target_lang: state.targetLang,
            voice: state.selectedVoice,
            rate: state.selectedRate,
            synthesize_audio: true
          })
        });
        const data = await resp.json();
        hideListeningUI();
        renderResultCard(data);
      } catch (err) {
        console.error(err);
        hideListeningUI();
        alert('Tarjima xatosi: ' + err.message);
      }
    }

    // Priming Audio Autoplay (Unlocks browser autoplay policies)
    function primeAudioPlayback() {
      try {
        globalAudio.src = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=';
        const p = globalAudio.play();
        if (p !== undefined) {
          p.then(() => globalAudio.pause()).catch(() => {});
        }
      } catch (_) {}
    }

    // WebSocket Setup
    function connectWebSocket() {
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${protocol}//${location.host}/ws/translator`;
      state.ws = new WebSocket(wsUrl);

      state.ws.onopen = () => {
        statusText.textContent = 'Tayyor';
        statusBadge.className = 'flex items-center gap-1.5 px-3 py-1 rounded-full bg-[#1e2e22] border border-[#22c55e]/40 shadow-sm shadow-[#22c55e]/20';
      };

      state.ws.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);
          if (msg.type === 'stage') {
            statusText.textContent = msg.stage;
          } else if (msg.type === 'transcript') {
            livePartialText.textContent = msg.source_text || 'Nutq aniqlandi...';
          } else if (msg.type === 'result' && msg.payload) {
            hideListeningUI();
            renderResultCard(msg.payload);
          } else if (msg.type === 'error') {
            alert(msg.message || 'Xatolik');
            stopRecording();
          }
        } catch (e) {
          console.error(e);
        }
      };

      state.ws.onclose = () => {
        statusText.textContent = 'Uzildi';
        statusBadge.className = 'flex items-center gap-1.5 px-3 py-1 rounded-full bg-[#381e1e] border border-rose-500/40 text-rose-300';
        setTimeout(connectWebSocket, 3000);
      };
    }
    connectWebSocket();

    // Click on Orb also toggles Recording
    mainOrganicOrb.addEventListener('click', () => {
      micBtn.click();
    });

    // Microphone & VAD Controls
    micBtn.addEventListener('click', () => {
      primeAudioPlayback();
      if (!state.isRecording) {
        startRecording();
      } else {
        stopRecording();
      }
    });

    async function startRecording() {
      try {
        state.mediaStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            channelCount: 1,
            sampleRate: 16000,
            echoCancellation: true,
            noiseSuppression: true,
          }
        });

        state.audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
        if (state.audioCtx.state === 'suspended') {
          await state.audioCtx.resume();
        }

        const source = state.audioCtx.createMediaStreamSource(state.mediaStream);
        state.analyser = state.audioCtx.createAnalyser();
        state.analyser.fftSize = 256;
        source.connect(state.analyser);

        state.scriptProcessor = state.audioCtx.createScriptProcessor(4096, 1, 1);
        source.connect(state.scriptProcessor);
        state.scriptProcessor.connect(state.audioCtx.destination);

        state.hasSpoken = false;
        state.lastVoiceTime = Date.now();

        if (state.ws && state.ws.readyState === WebSocket.OPEN) {
          state.ws.send(JSON.stringify({
            type: 'start_utterance',
            source_lang: state.sourceLang,
            target_lang: state.targetLang,
            voice: state.selectedVoice,
            rate: state.selectedRate,
            mime_type: 'audio/pcm',
            sample_rate: 16000
          }));
        }

        state.scriptProcessor.onaudioprocess = (e) => {
          if (!state.isRecording) return;
          const inputData = e.inputBuffer.getChannelData(0);
          
          let sumSquares = 0.0;
          const pcm16 = new Int16Array(inputData.length);
          for (let i = 0; i < inputData.length; i++) {
            const s = Math.max(-1, Math.min(1, inputData[i]));
            sumSquares += s * s;
            pcm16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
          }
          const rms = Math.sqrt(sumSquares / inputData.length);
          state.currentRms = rms;

          const now = Date.now();
          if (rms > state.voiceRmsThreshold) {
            state.hasSpoken = true;
            state.lastVoiceTime = now;
            statusText.textContent = "Eshitilmoqda";
          } else if (state.hasSpoken && (now - state.lastVoiceTime > state.silenceThresholdMs)) {
            // Auto-stop recording on natural pause
            stopRecording();
            return;
          }

          if (state.ws && state.ws.readyState === WebSocket.OPEN) {
            state.ws.send(pcm16.buffer);
          }
        };

        state.isRecording = true;
        micBtn.classList.replace('bg-[#242323]', 'bg-[#885151]');
        micIcon.className = 'fa-solid fa-square text-base';
        micButtonText.textContent = "To'xtatish";
        micPulseRing.classList.remove('hidden');

        showListeningUI("Nutq eshitilmoqda...");
        state.recStartTime = Date.now();
        state.recTimerInterval = setInterval(() => {
          const sec = Math.floor((Date.now() - state.recStartTime) / 1000);
          const m = String(Math.floor(sec / 60)).padStart(2, '0');
          const s = String(sec % 60).padStart(2, '0');
          liveTimerText.textContent = `${m}:${s}`;
        }, 500);

      } catch (err) {
        console.error(err);
        alert('Mikrofon xatosi: ' + err.message);
      }
    }

    function stopRecording() {
      if (!state.isRecording) return;
      state.isRecording = false;

      clearInterval(state.recTimerInterval);
      micBtn.classList.replace('bg-[#885151]', 'bg-[#242323]');
      micIcon.className = 'fa-solid fa-microphone text-lg';
      micButtonText.textContent = "Gapirish";
      micPulseRing.classList.add('hidden');
      statusText.textContent = "Tarjimada...";

      if (state.scriptProcessor) {
        state.scriptProcessor.disconnect();
        state.scriptProcessor = null;
      }
      if (state.mediaStream) {
        state.mediaStream.getTracks().forEach(track => track.stop());
        state.mediaStream = null;
      }
      if (state.audioCtx) {
        state.audioCtx.close();
        state.audioCtx = null;
      }

      state.currentRms = 0;
      if (state.ws && state.ws.readyState === WebSocket.OPEN) {
        state.ws.send(JSON.stringify({
          type: 'end_utterance',
          source_lang: state.sourceLang,
          target_lang: state.targetLang,
          voice: state.selectedVoice,
          rate: state.selectedRate
        }));
      }
    }

    // Dynamic Pearl movement inside the orb responding to voice volume
    // Orb o'zi katta bo'lmaydi, oq shakl uning ichida erkin aylanib, qimirlab yuradi!
    let pearlAngle = 0.8;
    let curPearlX = 52;
    let curPearlY = -52;

    function updatePearlPhysics() {
      requestAnimationFrame(updatePearlPhysics);

      if (state.isRecording) {
        // Gapirilayotganda oq shakl orb ichida erkin qimirlab, aylanib yuradi
        const rms = state.currentRms || 0;
        const speed = 0.04 + Math.min(0.24, rms * 2.2);
        pearlAngle += speed;

        // Orb ichki chegarasida to'lqinlanuvchi radius
        const r = 46 + Math.sin(pearlAngle * 2.1) * (14 + Math.min(24, rms * 70));
        const targetX = Math.cos(pearlAngle) * r;
        const targetY = Math.sin(pearlAngle * 0.85) * (r * 0.85);

        // Silliq harakat interpolyatsiyasi
        curPearlX += (targetX - curPearlX) * 0.16;
        curPearlY += (targetY - curPearlY) * 0.16;

        const pulseScale = 1.0 + Math.min(0.25, rms * 2.2);
        luminousPearl.style.transform = `translate(${curPearlX.toFixed(1)}px, ${curPearlY.toFixed(1)}px) scale(${pulseScale.toFixed(2)})`;
      } else {
        // Gapirilmayotganda boshlang'ich burchakka (tepa o'ng) asta qaytib, mayin tebranib turadi
        const idleWobbleX = 52 + Math.sin(Date.now() * 0.002) * 4;
        const idleWobbleY = -52 + Math.cos(Date.now() * 0.002) * 3;
        curPearlX += (idleWobbleX - curPearlX) * 0.08;
        curPearlY += (idleWobbleY - curPearlY) * 0.08;
        luminousPearl.style.transform = `translate(${curPearlX.toFixed(1)}px, ${curPearlY.toFixed(1)}px) scale(1)`;
      }
    }
    requestAnimationFrame(updatePearlPhysics);

    function showListeningUI(statusMsg) {
      floatingResultCard.classList.add('hidden');
      mainOrganicOrb.classList.add('recording');
      orbIdleText.classList.add('hidden');
      orbLiveTranscription.classList.remove('hidden');
      livePartialText.textContent = statusMsg;
    }

    function hideListeningUI() {
      mainOrganicOrb.classList.remove('recording');
      orbIdleText.classList.remove('hidden');
      orbLiveTranscription.classList.add('hidden');
      statusText.textContent = "Tayyor";
    }

    // RENDER THE BLUR RESULT CARD
    function renderResultCard(result) {
      const s = LANG_DATA[result.source_lang] || LANG_DATA.uz;
      const t = LANG_DATA[result.target_lang] || LANG_DATA.tr;

      cardDirectionBadge.textContent = `${result.source_lang.toUpperCase()} ➔ ${result.target_lang.toUpperCase()}`;
      cardTimestamp.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      cardSrcFlag.textContent = s.flag;
      cardSrcName.textContent = `${s.name} (Asl nutq)`;
      cardSrcText.textContent = result.source_text || '';

      cardTgtFlag.textContent = t.flag;
      cardTgtName.textContent = `${t.name} (Tarjima)`;
      cardTgtText.textContent = result.translated_text || '';

      cardLatencyText.textContent = result.latency ? `${result.latency.total_ms} ms` : '';

      // Audio handling
      if (result.audio_base64) {
        state.currentAudioBase64 = result.audio_base64;
        const audioSrc = `data:${result.audio_mime || 'audio/mpeg'};base64,${result.audio_base64}`;
        globalAudio.src = audioSrc;

        cardPlayAudioBtn.onclick = () => {
          if (globalAudio.paused) {
            globalAudio.currentTime = 0;
            globalAudio.play().then(() => {
              cardPlayIcon.className = 'fa-solid fa-pause text-xs';
            });
          } else {
            globalAudio.pause();
            cardPlayIcon.className = 'fa-solid fa-play text-xs';
          }
        };

        globalAudio.onended = () => {
          cardPlayIcon.className = 'fa-solid fa-play text-xs';
        };

        cardDownloadAudioBtn.onclick = () => {
          const a = document.createElement('a');
          a.href = audioSrc;
          a.download = `tarjima_${result.source_lang}_${result.target_lang}_${Date.now()}.mp3`;
          a.click();
        };

        // Autoplay if enabled
        if (state.autoPlay) {
          globalAudio.play().then(() => {
            cardPlayIcon.className = 'fa-solid fa-pause text-xs';
          }).catch(e => console.warn(e));
        }
      }

      floatingResultCard.classList.remove('hidden');
    }

    dismissCardBtn.addEventListener('click', () => {
      floatingResultCard.classList.add('hidden');
    });

    copySrcBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(cardSrcText.textContent);
      copySrcBtn.innerHTML = '<i class="fa-solid fa-check text-emerald-400"></i>';
      setTimeout(() => copySrcBtn.innerHTML = '<i class="fa-regular fa-copy"></i>', 1500);
    });

    copyTgtBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(cardTgtText.textContent);
      copyTgtBtn.innerHTML = '<i class="fa-solid fa-check text-emerald-400"></i>';
      setTimeout(() => copyTgtBtn.innerHTML = '<i class="fa-regular fa-copy"></i>', 1500);
    });

    // File Upload
    uploadAudioBtn.addEventListener('click', () => {
      primeAudioPlayback();
      audioFileInput.click();
    });

    audioFileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      showListeningUI(file.name);
      const formData = new FormData();
      formData.append('file', file);
      formData.append('source_lang', state.sourceLang);
      formData.append('target_lang', state.targetLang);
      formData.append('voice', state.selectedVoice);
      formData.append('rate', state.selectedRate);

      try {
        const resp = await fetch('/api/v1/translate-audio', {
          method: 'POST',
          body: formData
        });
        const data = await resp.json();
        hideListeningUI();
        renderResultCard(data);
      } catch (err) {
        hideListeningUI();
        alert('Audio faylni tarjima qilishda xatolik: ' + err.message);
      }
      audioFileInput.value = '';
    });

    // Initialize Language UI
    updateLanguageUI();

  </script>
</body>
</html>
